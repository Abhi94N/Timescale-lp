services:
  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: timescale-lo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tsdbadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tsdbpass}
      POSTGRES_DB: ${POSTGRES_DB:-metrics}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tsdb_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=timescaledb"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=2GB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "timescaledb.max_background_workers=8"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tsdbadmin} -d ${POSTGRES_DB:-metrics}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tsnet

  minio:
    image: minio/minio:latest
    container_name: timescale-lo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tsnet

  # One-shot: create the cold-storage bucket, then exit.
  createbuckets:
    image: minio/mc:latest
    container_name: timescale-lo-mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-timescale-cold} &&
      echo 'bucket ready: ${S3_BUCKET:-timescale-cold}'
      "
    networks:
      - tsnet

  ingest:
    build:
      context: ./ingest
      dockerfile: Dockerfile
    container_name: timescale-lo-ingest
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    environment:
      TSDB_HOST: timescaledb
      TSDB_PORT: 5432
      TSDB_USER: ${POSTGRES_USER:-tsdbadmin}
      TSDB_PASSWORD: ${POSTGRES_PASSWORD:-tsdbpass}
      TSDB_DATABASE: ${POSTGRES_DB:-metrics}
      INGEST_HTTP_ADDR: ":8080"
      INGEST_BATCH_SIZE: "5000"
      INGEST_BATCH_FLUSH_MS: "500"
      INGEST_WORKERS: "8"
      INGEST_POOL_MAX: "32"
      INGEST_CHUNK_INTERVAL: "1 day"
      # Tiered storage (hot = TimescaleDB write-through cache, cold = Parquet on MinIO).
      QUERY_ENGINE_ENABLED: "true"
      WRITE_THROUGH: "${WRITE_THROUGH:-true}"
      TIER_ENABLED: "${TIER_ENABLED:-false}"
      TIER_HOT_WINDOW: "${TIER_HOT_WINDOW:-7 days}"
      TIER_INTERVAL_SECONDS: "3600"
      S3_ENDPOINT: "http://minio:9000"
      S3_REGION: "us-east-1"
      S3_BUCKET: "${S3_BUCKET:-timescale-cold}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-minioadmin}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-minioadmin}"
    ports:
      - "${INGEST_PORT:-8080}:8080"
    networks:
      - tsnet

  grafana:
    image: grafana/grafana:latest
    container_name: timescale-lo-grafana
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - tsnet

volumes:
  tsdb_data:
  grafana_data:
  minio_data:

networks:
  tsnet:
    driver: bridge
