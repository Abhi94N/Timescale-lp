services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescale-lo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tsdbadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tsdbpass}
      POSTGRES_DB: ${POSTGRES_DB:-metrics}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tsdb_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=timescaledb"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=2GB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "timescaledb.max_background_workers=8"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tsdbadmin} -d ${POSTGRES_DB:-metrics}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tsnet

  ingest:
    build:
      context: ./ingest
      dockerfile: Dockerfile
    container_name: timescale-lo-ingest
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      TSDB_HOST: timescaledb
      TSDB_PORT: 5432
      TSDB_USER: ${POSTGRES_USER:-tsdbadmin}
      TSDB_PASSWORD: ${POSTGRES_PASSWORD:-tsdbpass}
      TSDB_DATABASE: ${POSTGRES_DB:-metrics}
      INGEST_HTTP_ADDR: ":8080"
      INGEST_BATCH_SIZE: "5000"
      INGEST_BATCH_FLUSH_MS: "500"
      INGEST_WORKERS: "8"
      INGEST_POOL_MAX: "32"
      INGEST_CHUNK_INTERVAL: "1 day"
    ports:
      - "${INGEST_PORT:-8080}:8080"
    networks:
      - tsnet

  grafana:
    image: grafana/grafana:latest
    container_name: timescale-lo-grafana
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - tsnet

volumes:
  tsdb_data:
  grafana_data:

networks:
  tsnet:
    driver: bridge
