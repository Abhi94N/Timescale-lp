name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.4"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies (incl. dev)
        run: uv sync --extra dev --frozen

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: ruff lint
        run: uv run ruff check .

      - name: pytest
        run: uv run pytest

  integration:
    name: integration (compose smoke)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Wait for ingest health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health; then
              echo "healthy"; exit 0
            fi
            sleep 2
          done
          echo "ingest never became healthy"
          docker compose ps
          docker compose logs --no-color | tail -200
          exit 1

      - name: Smoke write + query (write-through)
        run: |
          set -e
          # Old timestamp (2023) so it's eligible for eviction below.
          curl -fsS -X POST 'http://localhost:8080/api/v1/write?sync=true' \
            --data-binary $'cpu,host=a,region=us value=0.5,count=1i 1700000000000000000\ncpu,host=b value=0.7'
          sleep 1
          curl -fsS -X POST http://localhost:8080/api/v1/query \
            -H 'content-type: application/json' \
            -d '{"sql":"SELECT count(*) AS n FROM lp.cpu"}'

      - name: Update via line protocol (dedup-on-read check)
        run: |
          set -e
          # Re-send host=a's 2023 point with a new value; later read must reflect it.
          curl -fsS -X POST 'http://localhost:8080/api/v1/write?sync=true' \
            --data-binary 'cpu,host=a,region=us value=0.9,count=42i 1700000000000000000'

      - name: Compact + evict (write-through cache eviction)
        run: |
          set -euo pipefail
          # Compacts staging objects and evicts chunks older than 1 hour. The
          # 2023 rows already live in cold (write-through), so eviction is a
          # pure cache drop.
          curl -fsS -X POST http://localhost:8080/api/v1/tier/run \
            -H 'content-type: application/json' -d '{"older_than":"1 hour"}'
          curl -fsS http://localhost:8080/api/v1/tier/status

      - name: Federated read across hot + cold (with dedup + pruning)
        run: |
          set -euo pipefail
          # Federated count must still see the data after eviction, and the
          # updated value (0.9) must win over the original (0.5).
          ALL=$(curl -fsS -X POST 'http://localhost:8080/api/v1/query?tier=all' \
            -H 'content-type: application/json' \
            -d '{"sql":"SELECT count(*) AS n FROM lp.cpu"}')
          echo "federated count: $ALL"
          echo "$ALL" | grep -q '"n": *[1-9]'
          VAL=$(curl -fsS -X POST 'http://localhost:8080/api/v1/query?tier=all' \
            -H 'content-type: application/json' \
            -d '{"sql":"SELECT f_value FROM lp.cpu WHERE t_host='"'"'a'"'"'"}')
          echo "host=a value: $VAL"
          echo "$VAL" | grep -q '0.9'

      - name: Load test (a few million rows) + verify
        run: |
          set -e
          docker compose exec -T ingest python scripts/loadgen.py \
            --rows 2000000 --series 2000 --batch 10000 --concurrency 32 \
            --measurement load --verify

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -500

      - name: Tear down
        if: always()
        run: docker compose down -v

  docker-build:
    name: docker build (ingest)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./ingest
          push: false
          tags: timescale-lo-ingest:ci
