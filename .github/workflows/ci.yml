name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.4"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies (incl. dev)
        run: uv sync --extra dev --frozen

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: ruff lint
        run: uv run ruff check .

      - name: pytest
        run: uv run pytest

  integration:
    name: integration (compose smoke)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Wait for ingest health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health; then
              echo "healthy"; exit 0
            fi
            sleep 2
          done
          echo "ingest never became healthy"
          docker compose ps
          docker compose logs --no-color | tail -200
          exit 1

      - name: Smoke write + query
        run: |
          set -e
          curl -fsS -X POST 'http://localhost:8080/api/v1/write?sync=true' \
            --data-binary $'cpu,host=a,region=us value=0.5,count=1i 1700000000000000000\ncpu,host=b value=0.7'
          sleep 1
          curl -fsS -X POST http://localhost:8080/api/v1/query \
            -H 'content-type: application/json' \
            -d '{"sql":"SELECT count(*) AS n FROM lp.cpu"}'

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -500

      - name: Tear down
        if: always()
        run: docker compose down -v

  docker-build:
    name: docker build (ingest)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./ingest
          push: false
          tags: timescale-lo-ingest:ci
